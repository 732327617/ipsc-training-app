<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>IPSC 射击训练</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 2em; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .status { display: flex; align-items: center; gap: 10px; }
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .status-dot.disconnected { background: #ff4757; }
        .status-dot.connected { background: #2ed573; }
        .status-dot.game { background: #feca57; animation-duration: 0.5s; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        .target-info { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .target-item {
            background: rgba(255,255,255,0.1); border-radius: 15px;
            padding: 15px 20px; text-align: center; min-width: 80px;
            transition: all 0.3s;
        }
        .target-item.hit { background: #2ed573; }
        .target-item.current { border: 2px solid #feca57; box-shadow: 0 0 20px rgba(254,202,87,0.5); }
        .target-number { font-size: 1.5em; font-weight: bold; }
        .target-label { font-size: 0.8em; opacity: 0.7; }
        .countdown {
            text-align: center; font-size: 8em; font-weight: bold;
            margin: 30px 0; text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            color: #feca57;
        }
        .time-display {
            text-align: center; font-size: 4em; font-family: 'Courier New', monospace;
            margin: 20px 0; color: #feca57;
            text-shadow: 0 2px 10px rgba(254,202,87,0.3);
        }
        .result-card {
            background: linear-gradient(135deg, rgba(46,213,115,0.2), rgba(46,213,115,0.1));
            border: 1px solid rgba(46,213,115,0.3);
        }
        .result-title { text-align: center; font-size: 1.5em; margin-bottom: 15px; color: #2ed573; }
        .result-time { text-align: center; font-size: 3em; font-family: 'Courier New', monospace; color: #feca57; }
        .btn {
            width: 100%; padding: 20px; font-size: 1.3em; border: none;
            border-radius: 15px; cursor: pointer; margin: 10px 0;
            transition: all 0.3s; font-weight: bold;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-connect { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-start { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
        .btn-start:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 5px 20px rgba(245,87,108,0.4); }
        .btn-reset { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .btn-next { background: linear-gradient(135deg, #2ed573 0%, #7bed9f 100%); color: #1a1a2e; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .settings { margin-top: 15px; }
        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .setting-row:last-child { border-bottom: none; }
        input[type="number"] {
            width: 80px; padding: 8px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.2); color: white;
            text-align: center; font-size: 1em;
        }
        select {
            padding: 8px 12px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.2); color: white; font-size: 1em;
        }
        .toggle { position: relative; width: 50px; height: 26px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.2); transition: 0.3s; border-radius: 26px;
        }
        .toggle-slider:before {
            position: absolute; content: ""; height: 20px; width: 20px;
            left: 3px; bottom: 3px; background-color: white;
            transition: 0.3s; border-radius: 50%;
        }
        input:checked + .toggle-slider { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        input:checked + .toggle-slider:before { transform: translateX(24px); }
        .log {
            background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px;
            margin-top: 15px; max-height: 150px; overflow-y: auto;
            font-family: monospace; font-size: 0.85em;
        }
        .log-entry { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 15px; margin-top: 20px; }
        .stat-item { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; text-align: center; }
        .stat-value { font-size: 1.5em; font-weight: bold; color: #feca57; }
        .stat-label { font-size: 0.8em; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 IPSC 射击训练</h1>
        
        <div class="card">
            <div class="status-bar">
                <div class="status">
                    <span class="status-dot disconnected" id="statusDot"></span>
                    <span id="statusText">未连接</span>
                </div>
                <div id="battery">🔋</div>
            </div>
            
            <div class="target-info" id="targetInfo"></div>
            
            <div class="countdown" id="countdown" style="display: none;">5</div>
            <div class="time-display" id="timeDisplay">0.000</div>
            
            <div class="result-card" id="resultCard" style="display: none;">
                <div class="result-title">🎉 完成!</div>
                <div class="result-time" id="resultTime">0.000</div>
                <div class="stats" id="stats"></div>
            </div>
            
            <button class="btn btn-connect" id="connectBtn" onclick="connect()">🔗 连接靶子</button>
            <button class="btn btn-start" id="startBtn" onclick="startGame()" disabled>▶ 开始游戏</button>
            
            <div class="btn-group">
                <button class="btn btn-reset" id="resetBtn" onclick="resetGame()" disabled>↻ 重置</button>
                <button class="btn btn-next" id="nextBtn" onclick="nextTarget()" disabled>➜ 下一个</button>
            </div>
        </div>
        
        <div class="card">
            <h3 style="margin-bottom: 15px;">⚙️ 设置</h3>
            <div class="settings">
                <div class="setting-row">
                    <span>靶子数量</span>
                    <input type="number" id="targetCount" value="3" min="1" max="10" onchange="updateTargetUI()">
                </div>
                <div class="setting-row">
                    <span>倒计时 (秒)</span>
                    <input type="number" id="countdownTime" value="5" min="1" max="10">
                </div>
                <div class="setting-row">
                    <span>语音播报</span>
                    <label class="toggle"><input type="checkbox" id="voiceEnabled" checked><span class="toggle-slider"></span></label>
                </div>
                <div class="setting-row">
                    <span>开始音效</span>
                    <label class="toggle"><input type="checkbox" id="soundEnabled" checked><span class="toggle-slider"></span></label>
                </div>
                <div class="setting-row">
                    <span>模式</span>
                    <select id="gameMode">
                        <option value="sequential">顺序射击</option>
                        <option value="free">自由射击</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h3 style="margin-bottom: 15px;">📋 日志</h3>
            <div class="log" id="log"></div>
        </div>
    </div>
    
    <script>
        let device = null;
        let characteristicRx = null;
        let characteristicTx = null;
        let gameActive = false;
        let countdownActive = false;
        let currentTarget = 0;
        let totalTargets = 3;
        let hitTargets = [];
        let gameStartTime = 0;
        let hitTimes = [];
        let lastHitTime = 0;
        
        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHARACTERISTIC_UUID_RX = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
        const CHARACTERISTIC_UUID_TX = 'beb5483e-36e1-4688-b7f5-ea07361b26a9';
        
        function addLog(message) {
            const log = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${time}] ${message}`;
            log.insertBefore(entry, log.firstChild);
            if (log.children.length > 50) log.removeChild(log.lastChild);
        }
        
        function updateStatus(isConnected, isGame = false) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            dot.className = `status-dot ${isGame ? 'game' : (isConnected ? 'connected' : 'disconnected')}`;
            text.textContent = isGame ? '游戏中' : (isConnected ? '已连接' : '未连接');
            connectBtn.disabled = isConnected;
            startBtn.disabled = !isConnected || gameActive;
            resetBtn.disabled = !isConnected;
            connectBtn.textContent = isConnected ? '✅ 已连接' : '🔗 连接靶子';
        }
        
        function updateTargetUI() {
            totalTargets = parseInt(document.getElementById('targetCount').value);
            const targetInfo = document.getElementById('targetInfo');
            targetInfo.innerHTML = '';
            for (let i = 1; i <= totalTargets; i++) {
                const item = document.createElement('div');
                item.className = 'target-item';
                item.id = `target-${i}`;
                item.innerHTML = `<div class="target-number">${i}</div><div class="target-label">靶子</div>`;
                targetInfo.appendChild(item);
            }
        }
        
        async function connect() {
            try {
                addLog('正在搜索设备...');
                
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'IPSC_Slave' }],
                    optionalServices: [SERVICE_UUID]
                });
                
                addLog(`连接到 ${device.name}...`);
                
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                characteristicRx = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
                characteristicTx = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);
                
                await characteristicTx.startNotifications();
                characteristicTx.addEventListener('characteristicvaluechanged', handleNotification);
                device.addEventListener('gattserverdisconnected', onDisconnected);
                
                updateStatus(true);
                updateTargetUI();
                sendCommand('LED:RG');
                addLog('连接成功!');
                
            } catch (error) {
                addLog(`连接失败: ${error.message}`);
            }
        }
        
        function onDisconnected() {
            updateStatus(false);
            gameActive = false;
            countdownActive = false;
            addLog('设备已断开');
        }
        
        function handleNotification(event) {
            const value = new TextDecoder().decode(event.target.value);
            addLog(`收到: ${value}`);
            processMessage(value);
        }
        
        function processMessage(message) {
            if (message === 'STATUS:HIT') {
                handleHit();
            }
        }
        
        function handleHit() {
            if (!gameActive) return;
            const now = Date.now();
            if (lastHitTime > 0 && (now - lastHitTime) < 200) return;
            lastHitTime = now;
            
            const gameMode = document.getElementById('gameMode').value;
            
            if (gameMode === 'sequential') {
                if (currentTarget > 0 && currentTarget <= totalTargets) {
                    hitTarget(currentTarget);
                }
            } else {
                for (let i = currentTarget + 1; i <= totalTargets; i++) {
                    if (!hitTargets.includes(i)) {
                        hitTarget(i);
                        break;
                    }
                }
            }
        }
        
        function hitTarget(targetNum) {
            if (hitTargets.includes(targetNum)) return;
            
            hitTargets.push(targetNum);
            hitTimes.push((Date.now() - gameStartTime) / 1000);
            
            document.getElementById(`target-${targetNum}`).classList.add('hit');
            sendCommand('LED:F');
            addLog(`靶子 ${targetNum} 击中!`);
            
            if (hitTargets.length === totalTargets) {
                endGame();
            } else {
                currentTarget++;
                updateCurrentTarget();
            }
        }
        
        function updateCurrentTarget() {
            for (let i = 1; i <= totalTargets; i++) {
                document.getElementById(`target-${i}`).classList.remove('current');
            }
            if (currentTarget <= totalTargets) {
                document.getElementById(`target-${currentTarget}`).classList.add('current');
            }
        }
        
        async function sendCommand(command) {
            if (characteristicRx) {
                addLog(`发送: ${command}`);
                await characteristicRx.writeValue(new TextEncoder().encode(command));
            }
        }
        
        let countdownInterval = null;
        
        function startGame() {
            currentTarget = 1;
            hitTargets = [];
            hitTimes = [];
            gameActive = true;
            countdownActive = true;
            
            updateStatus(true, true);
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('timeDisplay').style.display = 'none';
            
            updateTargetUI();
            updateCurrentTarget();
            
            let countdown = parseInt(document.getElementById('countdownTime').value);
            document.getElementById('countdown').style.display = 'block';
            document.getElementById('countdown').textContent = countdown;
            
            if (document.getElementById('voiceEnabled').checked) speak(countdown.toString());
            
            countdownInterval = setInterval(() => {
                countdown--;
                document.getElementById('countdown').textContent = countdown;
                
                if (document.getElementById('voiceEnabled').checked && countdown > 0) {
                    speak(countdown.toString());
                }
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    countdownActive = false;
                    startShooting();
                }
            }, 1000);
        }
        
        function startShooting() {
            document.getElementById('countdown').style.display = 'none';
            document.getElementById('timeDisplay').style.display = 'block';
            document.getElementById('timeDisplay').textContent = '0.000';
            
            gameStartTime = Date.now();
            
            if (document.getElementById('soundEnabled').checked) playStartSound();
            sendCommand('LED:OFF');
            
            addLog('🎯 开始射击!');
            updateTimeDisplay();
        }
        
        function updateTimeDisplay() {
            if (!gameActive) return;
            const elapsed = (Date.now() - gameStartTime) / 1000;
            document.getElementById('timeDisplay').textContent = elapsed.toFixed(3);
            requestAnimationFrame(updateTimeDisplay);
        }
        
        function endGame() {
            gameActive = false;
            updateStatus(true, false);
            
            const totalTime = (Date.now() - gameStartTime) / 1000;
            
            sendCommand('LED:FF');
            
            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('resultTime').textContent = totalTime.toFixed(3) + ' 秒';
            
            const avgTime = totalTime / totalTargets;
            const stats = document.getElementById('stats');
            stats.innerHTML = `
                <div class="stat-item"><div class="stat-value">${totalTime.toFixed(3)}</div><div class="stat-label">总用时</div></div>
                <div class="stat-item"><div class="stat-value">${avgTime.toFixed(3)}</div><div class="stat-label">平均用时</div></div>
            `;
            
            addLog(`🎉 完成! 总用时: ${totalTime.toFixed(3)}秒`);
            
            if (document.getElementById('voiceEnabled').checked) {
                speak(`完成，总用时 ${totalTime.toFixed(2)} 秒`);
            }
        }
        
        function resetGame() {
            clearInterval(countdownInterval);
            gameActive = false;
            countdownActive = false;
            currentTarget = 0;
            hitTargets = [];
            hitTimes = [];
            
            document.getElementById('countdown').style.display = 'none';
            document.getElementById('timeDisplay').style.display = 'block';
            document.getElementById('timeDisplay').textContent = '0.000';
            document.getElementById('resultCard').style.display = 'none';
            
            updateStatus(true);
            updateTargetUI();
            sendCommand('LED:RG');
            
            addLog('游戏已重置');
        }
        
        function nextTarget() {
            if (currentTarget < totalTargets) {
                currentTarget++;
                updateCurrentTarget();
                addLog(`切换到靶子 ${currentTarget}`);
            }
        }
        
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.0;
                speechSynthesis.speak(utterance);
            }
        }
        
        function playStartSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(440, audioContext.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }
        
        updateTargetUI();
        updateStatus(false);
        addLog('准备就绪，请连接靶子');
    </script>
</body>
</html>
